
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Contatos</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header class="topbar">
        <div class="container topbar-content">
            <div class="logo">RC<span>.</span> CONTATOS</div>

            <a href="php/listar-contatos.php">Ver contatos cadastrados →</a>
        </div>
    </header>

    <main class="container">

        <div class="page-heading">
            <h1>Cadastro de contatos</h1>
            <p>Registre e organize suas informações em um só lugar.</p>
        </div>

        <section class="card">

            <h2>Novo contato</h2>

            <form id="contactForm"
                  action="php/salvar-contato.php"
                  method="POST">

                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome do contato"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input
                        type="text"
                        id="telefone"
                        name="telefone"
                        placeholder="+351 900 000 000"
                    >
                </div>

                <div class="form-group">
                    <label for="mensagem">Observações</label>
                    <textarea
                        id="mensagem"
                        name="mensagem"
                        placeholder="Escreva alguma informação sobre o contato..."
                    ></textarea>
                    <p class="form-hint">Campo opcional.</p>
                </div>

                <button type="submit" class="btn btn-primary">
                    Cadastrar contato
                </button>

            </form>

        </section>

    </main>

    <footer class="footer">
        <div class="container">
            Sistema de Contatos · Robison Carvalho
        </div>
    </footer>

</body>
</html>
